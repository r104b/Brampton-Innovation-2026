name: Offline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Lint, tests, and fixture snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            .github/ci/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r .github/ci/requirements.txt
      - name: Lint Python
        run: python -m ruff check --config .github/ci/ruff.toml backend tests agent-kit
      - name: Run offline tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Regenerate synthetic snapshot
        run: >-
          python -m backend.services.context_generator
          --input sample-data/project-state.json
          --output context/CURRENT_STATE.md --fixture
      - name: Verify committed snapshot is current
        run: git diff --exit-code -- context/CURRENT_STATE.md

  database-history:
    name: PostgreSQL history and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: sentra_test
        options: >-
          --health-cmd "pg_isready -U postgres -d sentra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply migrations and exercise actual history triggers
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash .github/ci/test_history.sh
