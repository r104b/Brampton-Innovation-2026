name: Client repository context sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-context-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.CONTEXT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Read synthetic state and propose Markdown update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTEXT_GITHUB_TOKEN: ${{ secrets.CONTEXT_GITHUB_TOKEN }}
          REGISTRY_BACKEND: supabase
          MASTER_REPOSITORY: ${{ github.repository }}
          MASTER_REVISION: ${{ github.sha }}
        run: python -m backend.services.github_sync
